<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060608">
  <meta name="color-scheme" content="dark">

  <title>EKA AI — Every AI. One Workspace.</title>
  <meta name="description" content="EKA AI brings every top AI model into a single unified workspace with local Bangladeshi payments. Coming soon to eka.bd.">
  <meta name="keywords" content="EKA AI, AI workspace Bangladesh, GPT-6 Astra, Claude Opus 5.5, Gemini 4 Argon, GPT-6.1 Sol, bKash AI, Nagad AI, deshi payments AI, eka.bd">

  <!-- Favicon / Web Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="EKA AI — Every AI. One Workspace.">
  <meta property="og:description" content="Something powerful is coming to eka.bd.">
  <meta property="og:image" content="assets/android-chrome-512x512.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eka.bd">
  <meta property="og:site_name" content="EKA AI">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="EKA AI — Coming Soon">
  <meta name="twitter:description" content="Every AI. One Workspace. Coming soon to eka.bd.">
  <meta name="twitter:image" content="assets/android-chrome-512x512.png">
  <meta name="twitter:creator" content="@ekaaiBD">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500&display=swap">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ─────────────────────────────────────────────────────────
       NAVIGATION
  ───────────────────────────────────────────────────────────── -->
  <header class="nav" role="banner">
    <a class="nav__logo" href="#" aria-label="EKA AI">
      <img src="assets/icon-transparent.png" alt="EKA AI Logo" class="nav__logo-img" width="28" height="28">
      <span class="nav__wordmark">
        <span class="nav__eka">EKA</span><span class="nav__ai">AI</span>
      </span>
    </a>
  </header>

  <main>

    <!-- ─────────────────────────────────────────────────────────
         HERO
    ───────────────────────────────────────────────────────────── -->
    <section class="hero" id="hero" aria-labelledby="hero-headline">

      <!-- Background layers -->
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__grid"></div>
        <div class="hero__bloom"></div>
        <div class="hero__fade"></div>
      </div>

      <!-- Floating model chips (decorative, depth controls parallax intensity) -->
      <div class="hero__chips" aria-hidden="true">

        <div class="chip-wrap chip-wrap--1" data-depth="2"
             style="top:12%;left:4%;--delay:1.0s">
          <div class="chip-drift" style="animation-name:floatA;animation-delay:0s">
            <div class="chip"><span class="chip__dot"></span>GPT-6 Astra</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--2 chip-wrap--r" data-depth="3"
             style="top:16%;left:78%;--delay:1.15s">
          <div class="chip-drift" style="animation-name:floatB;animation-delay:0.8s">
            <div class="chip"><span class="chip__dot"></span>Claude Opus 5.5</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--3" data-depth="2"
             style="top:66%;left:3%;--delay:1.3s">
          <div class="chip-drift" style="animation-name:floatC;animation-delay:1.2s">
            <div class="chip"><span class="chip__dot"></span>Gemini 4 Argon</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--4 chip-wrap--r" data-depth="4"
             style="top:71%;left:78%;--delay:1.1s">
          <div class="chip-drift" style="animation-name:floatA;animation-delay:0.4s">
            <div class="chip"><span class="chip__dot"></span>GPT-6.1 Sol</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--5 chip-wrap--top" data-depth="1"
             style="top:7%;left:52%;--delay:1.25s">
          <div class="chip-drift" style="animation-name:floatB;animation-delay:1.6s">
            <div class="chip"><span class="chip__dot"></span>Mistral Large 4</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--6 chip-wrap--bot" data-depth="3"
             style="top:83%;left:27%;--delay:1.4s">
          <div class="chip-drift" style="animation-name:floatC;animation-delay:0.6s">
            <div class="chip"><span class="chip__dot"></span>Flux 1.1 Pro</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--7 chip-wrap--r" data-depth="2"
             style="top:38%;left:88%;--delay:1.2s">
          <div class="chip-drift" style="animation-name:floatA;animation-delay:1.0s">
            <div class="chip"><span class="chip__dot"></span>Grok 4</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--8 chip-wrap--bot" data-depth="1"
             style="top:87%;left:60%;--delay:1.5s">
          <div class="chip-drift" style="animation-name:floatB;animation-delay:1.4s">
            <div class="chip"><span class="chip__dot"></span>Muse Wonder</div>
          </div>
        </div>

        <div class="chip-wrap chip-wrap--9" data-depth="4"
             style="top:47%;left:1.5%;--delay:1.35s">
          <div class="chip-drift" style="animation-name:floatC;animation-delay:0.2s">
            <div class="chip"><span class="chip__dot"></span>DeepSeek-V4.1</div>
          </div>
        </div>

      </div><!-- /.hero__chips -->

      <!-- Hero content -->
      <div class="hero__content">

        <div class="hero__badge reveal-hero" style="--reveal-delay:0ms">
          <span class="badge__pulse"></span>
          <span class="badge__label">COMING SOON</span>
        </div>

        <h1 class="hero__headline reveal-hero" id="hero-headline" style="--reveal-delay:90ms">
          <span class="headline-row">Every AI.</span>
          <span class="headline-row headline-row--dim">One Workspace.</span>
        </h1>

        <p class="hero__sub reveal-hero" style="--reveal-delay:190ms">
          Something powerful is coming to&nbsp;<strong class="hero__domain-em">eka.bd</strong>
        </p>

        <p class="hero__domain-tag reveal-hero" style="--reveal-delay:300ms">eka.bd</p>

      </div><!-- /.hero__content -->

    </section><!-- /.hero -->

  </main>

  <script src="js/main.js"></script>
</body>
</html>
